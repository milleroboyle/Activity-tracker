<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Activity Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #555555;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f5f5f5;
      --color-border-secondary: #d0d0d0;
      --color-border-tertiary: #e5e5e5;
      --border-radius-md: 6px;
      --border-radius-lg: 8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);background-color:#fafafa}
    .app{padding:1.5rem 1rem;max-width:900px;margin:0 auto}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
    .header-left h1{font-size:22px;font-weight:600;color:var(--color-text-primary)}
    .header-left p{font-size:13px;color:var(--color-text-secondary);margin-top:2px}
    .agent-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .agent-row input{padding:8px 12px;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:14px;background:var(--color-background-primary);color:var(--color-text-primary);width:180px}
    .agent-row input::placeholder{color:#999}
    .date-row{display:flex;align-items:center;gap:8px}
    .date-row input[type=date]{padding:8px 12px;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:14px;background:var(--color-background-primary);color:var(--color-text-primary)}
    .score-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
    .score-card{background:var(--color-background-secondary);border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px 14px}
    .score-card .label{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
    .score-card .value{font-size:26px;font-weight:600;color:var(--color-text-primary)}
    .score-card.grand .value{color:#185FA5}
    .section{border:1px solid #ddd;border-radius:var(--border-radius-lg);margin-bottom:1rem;overflow:hidden;background:#fff}
    .section-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--color-background-secondary);cursor:pointer;user-select:none;border-bottom:1px solid #eee}
    .section-header-left{display:flex;align-items:center;gap:8px}
    .section-header-left i{font-size:18px;color:var(--color-text-secondary)}
    .section-title{font-size:14px;font-weight:600;color:var(--color-text-primary)}
    .section-pts{font-size:12px;color:var(--color-text-secondary)}
    .section-score{font-size:14px;font-weight:600;color:#185FA5}
    .chevron{font-size:16px;color:var(--color-text-secondary);transition:transform 0.2s}
    .chevron.open{transform:rotate(180deg)}
    .activity-list{display:none;padding:0}
    .activity-list.open{display:block}
    .activity-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid #eee}
    .activity-row:first-child{border-top:none}
    .act-left{flex:1;font-size:13px;color:var(--color-text-primary);line-height:1.5}
    .act-pts{font-size:12px;color:var(--color-text-secondary);margin-left:8px;white-space:nowrap}
    .counter{display:flex;align-items:center;gap:6px;margin-left:12px}
    .counter button{width:28px;height:28px;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-weight:600}
    .counter button:hover{background:var(--color-background-secondary)}
    .counter span{min-width:22px;text-align:center;font-size:14px;font-weight:600;color:var(--color-text-primary)}
    .actions{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap}
    .btn{padding:10px 16px;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;cursor:pointer;font-weight:500}
    .btn:hover{background:var(--color-background-secondary)}
    .btn.primary{background:#185FA5;color:#fff;border-color:#185FA5;font-weight:600}
    .btn.primary:hover{background:#0C447C}
    .btn.danger{color:#A32D2D;border-color:#A32D2D}
    .btn.danger:hover{background:var(--color-background-secondary)}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#185FA5;color:#fff;padding:12px 20px;border-radius:var(--border-radius-md);font-size:13px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999}
    .toast.show{opacity:1}
    .history-section{margin-top:1.5rem}
    .history-section h2{font-size:16px;font-weight:600;color:var(--color-text-primary);margin-bottom:10px}
    .history-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
    .history-table th{text-align:left;padding:10px 10px;background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:600;border-bottom:1px solid #ddd}
    .history-table td{padding:10px 10px;border-bottom:1px solid #eee;color:var(--color-text-primary)}
    .history-table tr:last-child td{border-bottom:none}
    .empty-state{font-size:13px;color:var(--color-text-secondary);padding:12px 0}
    .badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:var(--border-radius-md);background:#E6F1FB;color:#185FA5;font-weight:600}
    .status-indicator{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
    .status-indicator.online{background-color:#10b981}
    .status-indicator.offline{background-color:#ef4444}
    .status-indicator.connecting{background-color:#f59e0b;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  </style>
</head>
<body>

<div class="app">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden">Real estate activity tracker — log daily activities and earn points</h2>
  <div class="header">
    <div class="header-left">
      <h1>Activity Tracker</h1>
      <p>Log your activities and earn points daily</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
      <div style="font-size:12px;color:var(--color-text-secondary)"><span class="status-indicator connecting" id="statusIndicator"></span><span id="statusText">Connecting...</span></div>
      <div class="agent-row">
        <i class="ti ti-user" style="font-size:16px;color:var(--color-text-secondary)" aria-hidden="true"></i>
        <input type="text" id="agentName" placeholder="Your name" />
      </div>
      <div class="date-row">
        <i class="ti ti-calendar" style="font-size:16px;color:var(--color-text-secondary)" aria-hidden="true"></i>
        <input type="date" id="trackDate" />
      </div>
    </div>
  </div>

  <div class="score-bar" id="scoreBar"></div>

  <div id="sections"></div>

  <div class="actions">
    <button class="btn primary" onclick="saveEntry()"><i class="ti ti-device-floppy" aria-hidden="true"></i> Save today's entry</button>
    <button class="btn" onclick="resetForm()"><i class="ti ti-refresh" aria-hidden="true"></i> Reset</button>
  </div>

  <div class="history-section">
    <h2>Team history</h2>
    <div id="historyContainer"><p class="empty-state">Loading...</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

  apiKey: "AIzaSyBiX6QrL1OmJXQm5T1jXmQ8dP9vK2lW3zA",
  authDomain: "activity-tracker-a5f8c.firebaseapp.com",
  databaseURL: "https://activity-tracker-a5f8c-default-rtdb.firebaseio.com",
  projectId: "activity-tracker-a5f8c",
  storageBucket: "activity-tracker-a5f8c.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef123456"
};

let isOnline = false;
let database = null;
let initialized = false;

// Initialize Firebase
try {
  firebase.initializeApp(firebaseConfig);
  database = firebase.database();
  initialized = true;
  console.log('Firebase initialized');
  
  // Check connection status
  database.ref('.info/connected').on('value', (snap) => {
    console.log('Connection status:', snap.val());
    if (snap.val() === true) {
      isOnline = true;
      updateStatus(true, 'Cloud sync active');
      loadHistory();
    } else {
      isOnline = false;
      updateStatus(false, 'Offline mode');
    }
  });
  
  // Timeout fallback - if no response in 5 seconds, use offline
  setTimeout(() => {
    if (!isOnline) {
      console.log('Connection timeout - using offline mode');
      updateStatus(false, 'Offline mode (ready to use)');
    }
  }, 5000);
  
} catch(e) {
  console.error('Firebase initialization failed:', e);
  initialized = false;
  updateStatus(false, 'Running offline');
}

function updateStatus(online, text) {
  const indicator = document.getElementById('statusIndicator');
  const statusText = document.getElementById('statusText');
  if (online) {
    indicator.className = 'status-indicator online';
  } else {
    indicator.className = 'status-indicator offline';
  }
  statusText.textContent = text;
}

      {id:"seller_coverage",label:"Add seller coverage",pts:2},
      {id:"close_buyer_gra",label:"Close buyer controlled sale with GRA",pts:4},
      {id:"close_buyer_title",label:"Close buyer controlled sale with title partner",pts:4},
    ]
  },
];

const counts = {};
CATEGORIES.forEach(cat => cat.items.forEach(item => { counts[item.id] = 0; }));

function getToday() {
  return new Date().toISOString().slice(0,10);
}

document.getElementById('trackDate').value = getToday();

function calcCatTotal(cat) {
  return cat.items.reduce((s,item) => s + counts[item.id]*item.pts, 0);
}
function calcGrandTotal() {
  return CATEGORIES.reduce((s,cat) => s + calcCatTotal(cat), 0);
}

function updateScores() {
  const bar = document.getElementById('scoreBar');
  bar.innerHTML = '';
  const grand = calcGrandTotal();
  const grandCard = document.createElement('div');
  grandCard.className = 'score-card grand';
  grandCard.innerHTML = `<div class="label">Grand total</div><div class="value">${grand}</div>`;
  bar.appendChild(grandCard);
  CATEGORIES.forEach(cat => {
    const pts = calcCatTotal(cat);
    if(pts > 0) {
      const c = document.createElement('div');
      c.className = 'score-card';
      c.innerHTML = `<div class="label" style="font-size:11px">${cat.label}</div><div class="value" style="font-size:18px">${pts}</div>`;
      bar.appendChild(c);
    }
  });
}

function buildSections() {
  const container = document.getElementById('sections');
  CATEGORIES.forEach(cat => {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.id = 'sec_'+cat.id;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <div class="section-header-left">
        <i class="ti ${cat.icon}" aria-hidden="true"></i>
        <span class="section-title">${cat.label}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="section-score" id="cat_score_${cat.id}">0 pts</span>
        <i class="ti ti-chevron-down chevron" id="chev_${cat.id}" aria-hidden="true"></i>
      </div>`;
    header.onclick = () => {
      const list = document.getElementById('list_'+cat.id);
      const chev = document.getElementById('chev_'+cat.id);
      list.classList.toggle('open');
      chev.classList.toggle('open');
    };

    const list = document.createElement('div');
    list.className = 'activity-list';
    list.id = 'list_'+cat.id;

    cat.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'activity-row';
      row.innerHTML = `
        <span class="act-left">${item.label}</span>
        <span class="act-pts">${item.pts} pt${item.pts!==1?'s':''}</span>
        <div class="counter">
          <button onclick="change('${item.id}',-1,'${cat.id}')" aria-label="decrease">−</button>
          <span id="cnt_${item.id}">0</span>
          <button onclick="change('${item.id}',1,'${cat.id}')" aria-label="increase">+</button>
        </div>`;
      list.appendChild(row);
    });

    sec.appendChild(header);
    sec.appendChild(list);
    container.appendChild(sec);
  });
}

function change(id, delta, catId) {
  counts[id] = Math.max(0, (counts[id]||0) + delta);
  document.getElementById('cnt_'+id).textContent = counts[id];
  const cat = CATEGORIES.find(c=>c.id===catId);
  document.getElementById('cat_score_'+catId).textContent = calcCatTotal(cat)+' pts';
  updateScores();
}

async function saveEntry() {
  const agent = document.getElementById('agentName').value.trim() || 'Unknown';
  const date = document.getElementById('trackDate').value;
  const grand = calcGrandTotal();
  if(grand === 0) { showToast('No activities logged yet!'); return; }

  const catBreakdown = {};
  CATEGORIES.forEach(cat => {
    const pts = calcCatTotal(cat);
    if(pts > 0) catBreakdown[cat.label] = pts;
  });

  const entry = { agent, date, grand, catBreakdown, ts: Date.now() };
  
  if (isOnline && initialized && database) {
    try {
      const entryId = date + '_' + agent + '_' + Date.now();
      await database.ref('entries/' + entryId).set(entry);
      showToast('Entry saved to cloud!');
      setTimeout(() => loadHistory(), 500);
      resetForm();
    } catch(e) {
      console.error('Cloud save error:', e);
      saveLocally(entry);
      showToast('Saved locally - will sync when online');
    }
  } else {
    saveLocally(entry);
    showToast('Saved locally - will sync when online');
  }
}

function saveLocally(entry) {
  const local = JSON.parse(localStorage.getItem('pending_entries') || '[]');
  local.push(entry);
  localStorage.setItem('pending_entries', JSON.stringify(local));
}

function resetForm() {
  CATEGORIES.forEach(cat => cat.items.forEach(item => {
    counts[item.id] = 0;
    const el = document.getElementById('cnt_'+item.id);
    if(el) el.textContent = '0';
    const scoreEl = document.getElementById('cat_score_'+cat.id);
    if(scoreEl) scoreEl.textContent = '0 pts';
  }));
  updateScores();
}

function loadHistory() {
  const container = document.getElementById('historyContainer');
  
  if (isOnline && initialized && database) {
    try {
      database.ref('entries').orderByChild('ts').limitToLast(100).once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          renderHistory(data);
        } else {
          loadLocalHistory();
        }
      }).catch(e => {
        console.log('Cloud load failed, using local:', e);
        loadLocalHistory();
      });
    } catch(e) {
      console.error('Load history error:', e);
      loadLocalHistory();
    }
  } else {
    loadLocalHistory();
  }
}

function loadLocalHistory() {
  const local = JSON.parse(localStorage.getItem('pending_entries') || '[]');
  if (local.length > 0) {
    const entries = {};
    local.forEach(e => {
      entries[e.ts] = e;
    });
    renderHistory(entries);
  } else {
    document.getElementById('historyContainer').innerHTML = '<p class="empty-state">No entries saved yet.</p>';
  }
}

function renderHistory(entries) {
  const container = document.getElementById('historyContainer');
  
  if (!entries || Object.keys(entries).length === 0) {
    container.innerHTML = '<p class="empty-state">No entries saved yet.</p>';
    return;
  }

  const entriesArray = Object.values(entries).sort((a,b) => (b.ts||0) - (a.ts||0));
  const agentTotals = {};
  entriesArray.forEach(e => {
    if(!agentTotals[e.agent]) agentTotals[e.agent] = 0;
    agentTotals[e.agent] += e.grand;
  });

  let html = '';

  if(Object.keys(agentTotals).length > 1) {
    html += '<div style="margin-bottom:1rem"><h3 style="font-size:14px;font-weight:600;color:var(--color-text-primary);margin-bottom:8px">Team leaderboard</h3><div style="display:flex;flex-wrap:wrap;gap:8px;">';
    const sorted = Object.entries(agentTotals).sort((a,b)=>b[1]-a[1]);
    sorted.forEach(([name, total], i) => {
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
      html += `<div class="score-card" style="min-width:120px"><div class="label">${medal} ${name}</div><div class="value" style="font-size:20px">${total}</div></div>`;
    });
    html += '</div></div>';
  }

  html += '<table class="history-table"><thead><tr><th>Date</th><th>Agent</th><th>Top categories</th><th>Total pts</th></tr></thead><tbody>';
  entriesArray.slice(0, 50).forEach(e => {
    const top = Object.entries(e.catBreakdown||{}).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>`<span class="badge">${k}: ${v}</span>`).join(' ');
    html += `<tr><td>${e.date}</td><td>${e.agent}</td><td>${top}</td><td style="font-weight:600;color:#185FA5">${e.grand}</td></tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

buildSections();
updateScores();

// Load history when ready
